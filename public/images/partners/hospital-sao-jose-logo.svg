<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" preserveAspectRatio="xMidYMid meet">
  <!-- Cruz médica estilizada -->
  <g>
    <!-- Cruz verde -->
    <rect x="35" y="25" width="30" height="50" fill="#4A7766" rx="3"/>
    <rect x="20" y="40" width="60" height="20" fill="#4A7766" rx="3"/>
    
    <!-- Destaque dourado no centro -->
    <circle cx="50" cy="50" r="8" fill="#D4AF37"/>
    
    <!-- Sombra sutil -->
    <rect x="37" y="27" width="26" height="46" fill="#3A5F52" opacity="0.3" rx="3"/>
    <rect x="22" y="42" width="56" height="16" fill="#3A5F52" opacity="0.3" rx="3"/>
  </g>
  
  <!-- Texto HOSPITAL -->
  <text x="100" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="300" fill="#4A7766" letter-spacing="2">HOSPITAL</text>
  
  <!-- Texto São José -->
  <g>
    <!-- São -->
    <text x="100" y="60" font-family="Georgia, serif" font-size="32" font-weight="300" fill="#D4AF37">São</text>
    <!-- José -->
    <text x="165" y="60" font-family="Georgia, serif" font-size="32" font-weight="400" fill="#4A7766">José</text>
  </g>
  
  <!-- Texto Itaquaí RS -->
  <text x="100" y="75" font-family="Arial, sans-serif" font-size="11" font-weight="300" fill="#4A7766" letter-spacing="1">Itaquaí RS</text>
</svg>