<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CN Vidas - Offline</title>
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f3f4f6;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 2rem;
        }
        .logo {
            width: 120px;
            margin-bottom: 2rem;
        }
        h1 {
            color: #1f2937;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        p {
            color: #6b7280;
            line-height: 1.6;
        }
        .retry-btn {
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 0.375rem;
            font-size: 1rem;
            cursor: pointer;
        }
        .retry-btn:hover {
            background: #0284c7;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/icon-192x192.png" alt="CN Vidas" class="logo">
        <h1>Você está offline</h1>
        <p>Parece que você está sem conexão com a internet. Verifique sua conexão e tente novamente.</p>
        <button class="retry-btn" onclick="window.location.reload()">Tentar Novamente</button>
    </div>
</body>
</html>
