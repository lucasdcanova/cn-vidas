version: 1
workflows:
  - name: Build iOS App
    environment:
      xcode: latest-release
    triggers:
      - push:
          branches:
            - main
    scripts:
      post-clone: |
        #!/bin/sh
        set -e
        
        echo "🚀 Executando script post-clone do Xcode Cloud..."
        echo "📍 Diretório atual: $(pwd)"
        echo "📂 Conteúdo do diretório:"
        ls -la
        
        # Verificar se o arquivo Podfile existe
        if [ ! -f "ios/App/Podfile" ]; then
            echo "❌ Erro: Podfile não encontrado em ios/App/Podfile"
            exit 1
        fi
        
        # Instalar CocoaPods se necessário
        if ! command -v pod &> /dev/null; then
            echo "📦 Instalando CocoaPods..."
            export GEM_HOME=$HOME/.gem
            export PATH=$GEM_HOME/bin:$PATH
            gem install cocoapods --user-install
        else
            echo "✅ CocoaPods já está instalado"
        fi
        
        # Navegar para o diretório do iOS
        cd ios/App
        echo "📍 Mudou para diretório: $(pwd)"
        
        # Verificar se Pods já existe
        if [ -d "Pods" ]; then
            echo "📂 Diretório Pods já existe"
            # Verificar se precisa atualizar
            if [ -f "Podfile.lock" ]; then
                echo "🔧 Executando pod install (sem update)..."
                pod install
            else
                echo "🔧 Executando pod install com repo-update..."
                pod install --repo-update
            fi
        else
            echo "🔧 Executando pod install inicial com repo-update..."
            pod install --repo-update
        fi
        
        echo "✅ Script post-clone concluído com sucesso!"